[project]
name = "family-memories-backend"
version = "0.1.0"
description = "Local-first family photo memories - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10,<5",  # 5.x removed Haar cascades (eye check)
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",  # bundled local ffmpeg for H.264 video export
    "onnxruntime>=1.18",  # local CLIP / face models
    "tokenizers>=0.19",  # CLIP text tokenizer (scene tags)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ephem>=4.1",  # scripts/gen_festival_dates.py only
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
